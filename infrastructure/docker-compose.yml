services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: e2m
      POSTGRES_PASSWORD: e2m
      POSTGRES_DB: e2m
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
      - minio
      - ai-worker

  ai-worker:
    build:
      context: ../ai-worker
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    ports:
      - '8000:8000'
    depends_on:
      - minio

volumes:
  postgres_data:
  minio_data:
